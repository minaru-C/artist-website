# Settings for the website editor at /admin.
# One-time setup: replace the three YOUR-... values below (see README.md).

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/artist-website
  branch: main
  base_url: https://sveltia-cms-auth.YOUR-CLOUDFLARE-SUBDOMAIN.workers.dev

site_url: https://YOUR-SITE.pages.dev

# Uploaded photos are saved here, renamed to web-friendly names,
# converted to WebP and shrunk automatically. 1600px looks sharp on
# screens but is too small to make good-quality prints from.
media_folder: images/uploads
public_folder: /images/uploads
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1600
        height: 1600

collections:
  - name: website
    label: Website
    editor:
      preview: false
    files:

      - name: gallery
        label: Gallery
        file: content/gallery.json
        fields:
          - name: items
            label: Artworks
            label_singular: Artwork
            widget: list
            collapsed: true
            add_to_top: true
            summary: "{{fields.title}}"
            hint: Drag to reorder. New pieces are added at the top.
            fields:
              - { name: image, label: Photo, widget: image, required: false }
              - { name: title, label: Title, widget: string }
              - name: category
                label: Category
                widget: select
                default: watercolor
                options:
                  - { label: Watercolor, value: watercolor }
                  - { label: Charcoal portrait, value: charcoal }
                  - { label: Illustration, value: illustration }
              - { name: medium, label: Medium, widget: string, required: false, hint: "e.g. Watercolor on cotton paper" }
              - { name: size, label: Size, widget: string, required: false, hint: "e.g. 11×14 in" }

      - name: shop
        label: Shop
        file: content/shop.json
        fields:
          - name: items
            label: Pieces for sale
            label_singular: Piece
            widget: list
            collapsed: true
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: Photo, widget: image, required: false }
              - { name: title, label: Title, widget: string }
              - name: category
                label: Category
                widget: select
                default: watercolor
                options:
                  - { label: Watercolor, value: watercolor }
                  - { label: Charcoal portrait, value: charcoal }
                  - { label: Illustration, value: illustration }
              - { name: details, label: Details, widget: string, required: false, hint: "e.g. Original · 9×12 in   or   Signed print · 11×14 in" }
              - { name: price, label: Price in dollars, widget: number, value_type: int, required: false }
              - { name: sold, label: Sold, widget: boolean, default: false }
              - { name: buy_link, label: Payment link, widget: string, required: false, hint: "Optional: paste a Stripe Payment Link to show a Buy now button. Leave empty to show an Inquire button instead." }

      - name: commissions
        label: Commissions
        file: content/commissions.json
        fields:
          - name: items
            label: Commission types
            label_singular: Commission type
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: Example picture, widget: image, required: false }
              - { name: title, label: Title, widget: string }
              - { name: price, label: Price, widget: string, required: false, hint: "e.g. from $150" }
              - { name: description, label: Description, widget: text, required: false }

      - name: classes
        label: Classes
        file: content/classes.json
        fields:
          - name: items
            label: Classes
            label_singular: Class
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: label, label: Small label, widget: string, required: false, hint: "e.g. Live · 4 weeks" }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text, required: false }
              - { name: details, label: When & price, widget: string, required: false, hint: "e.g. Tuesdays · 7pm ET · $120" }
              - { name: button_text, label: Button text, widget: string, default: Enroll }
              - { name: link, label: Signup link, widget: string, required: false, hint: "Zoom, Eventbrite, Teachable… Leave empty and the button opens the request form." }

      - name: books
        label: Books
        file: content/books.json
        fields:
          - name: items
            label: Books
            label_singular: Book
            widget: list
            collapsed: true
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: Cover, widget: image, required: false }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: string, required: false, hint: "e.g. Written by Author Name · 2025" }
              - { name: link, label: Link to buy the book, widget: string, required: false }

      - name: settings
        label: About & contact
        file: content/settings.json
        fields:
          - { name: artist_name, label: Your name, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: instagram, label: Instagram handle, widget: string, hint: "Without the @" }
          - { name: tagline, label: Small line above the headline, widget: string, required: false }
          - { name: hero_heading, label: Headline, widget: string, hint: "Put *stars* around words to show them in italic color." }
          - { name: hero_text, label: Text under the headline, widget: text, required: false }
          - { name: hero_image, label: Big picture at the top, widget: image, required: false }
          - { name: about_photo, label: Photo of you, widget: image, required: false }
          - { name: about_text, label: About me, widget: text, required: false, hint: "Leave a blank line between paragraphs." }
